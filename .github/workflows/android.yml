name: Android

on:
  push:
    paths:
      - 'android/**'
      - 'src/data/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy logiki i treści (czysty Kotlin)
        run: ./gradlew -p core test

      - name: Testy aplikacji (Robolectric), lint i budowanie APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: akademia-sarkazmu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Raporty testów i lintu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          if-no-files-found: ignore
